services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cinevault}
      POSTGRES_USER: ${POSTGRES_USER:-cinevault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cinevault}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cinevault}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./cinevault-backend
      dockerfile: docker/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./cinevault-backend:/app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    build:
      context: ./cinevault-backend
      dockerfile: docker/Dockerfile
    command: celery -A config worker -l info
    volumes:
      - ./cinevault-backend:/app
    env_file: .env
    depends_on:
      - backend
      - redis

  celery-beat:
    build:
      context: ./cinevault-backend
      dockerfile: docker/Dockerfile
    command: celery -A config beat -l info
    volumes:
      - ./cinevault-backend:/app
    env_file: .env
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./cinevault-frontend
    command: npm run dev
    volumes:
      - ./cinevault-frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
